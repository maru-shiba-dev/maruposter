<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaruPoster — Authorization</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}h1{font-size:24px}code{background:#f0f0f0;padding:2px 6px;border-radius:4px;word-break:break-all}</style>
</head>
<body>
<h1>Authorization received</h1>
<p>Thank you. To finish connecting MaruPoster, copy the full URL of this page from the address bar and send it to Maru.</p>
<p id="code-line" style="display:none">Authorization code: <code id="code"></code></p>
<script>
var p = new URLSearchParams(location.search);
var c = p.get('code');
if (c) { document.getElementById('code').textContent = c; document.getElementById('code-line').style.display = 'block'; }
</script>
</body>
</html>
